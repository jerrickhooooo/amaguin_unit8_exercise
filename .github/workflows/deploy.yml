name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Build web release
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          CMS_URL: ${{ vars.CMS_URL }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define="OMDB_KEY=$OMDB_KEY"
          --dart-define="CMS_URL=$CMS_URL"
          --dart-define="CMS_TOKEN=$CMS_TOKEN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
